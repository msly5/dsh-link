<svg xmlns="http://www.w3.org/2000/svg" width="900" height="232" viewBox="0 0 900 232" role="img" aria-labelledby="title desc">
  <title id="title">How dsh link connects</title>
  <desc id="desc">dsh link on iPhone or iPad connects through Cloudflare Access and Tunnel to the Computer bridge and DSH desktop app.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; text-anchor: middle; }
    .title { fill: #edf4ef; font-size: 23px; font-weight: 600; }
    .detail { fill: #a8b9ae; font-size: 17px; }
    .route { fill: #a8b9ae; font-size: 11px; font-weight: 500; letter-spacing: .3px; }
    .icon { fill: none; stroke: #91b49d; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 1l3 3-3 3" fill="none" stroke="#91b49d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g fill="#171d1a" stroke="#303e36">
    <rect x="20" y="28" width="240" height="176" rx="20"/>
    <rect x="330" y="28" width="240" height="176" rx="20"/>
    <rect x="640" y="28" width="240" height="176" rx="20"/>
  </g>
  <g stroke="#33473a" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M275 123h38"/>
    <path d="M585 123h38"/>
  </g>
  <text class="route" x="295" y="104">HTTPS / WSS</text>
  <text class="route" x="605" y="104">Secure tunnel</text>
  <g class="icon">
    <rect x="129" y="57" width="22" height="34" rx="5"/>
    <path d="M137 85h6"/>
    <path d="M438 84h26a8 8 0 0 0 1-16 13 13 0 0 0-25-3 10 10 0 0 0-2 19Z"/>
    <rect x="744" y="59" width="32" height="23" rx="3"/>
    <path d="M740 88h40m-24-6v6m8-6v6"/>
  </g>
  <text class="title" x="140" y="128">iOS / Android</text>
  <text class="detail" x="140" y="158">dsh link</text>
  <text class="title" x="450" y="128">Cloudflare</text>
  <text class="detail" x="450" y="158">Access · Tunnel</text>
  <text class="title" x="760" y="128">Your Mac</text>
  <text class="detail" x="760" y="158">Bridge → DSH</text>
</svg>
