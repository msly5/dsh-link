name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  bridge-and-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bridge/package-lock.json
      - run: npm ci --ignore-scripts --prefix bridge
      - run: npm test --prefix bridge
      - run: python3 -m unittest discover -s scripts/tests
      - run: python3 scripts/check-secrets.py
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: xcodebuild -version
      - run: swift test
      - run: xcodebuild -project DSHRemote.xcodeproj -scheme DSHRemote -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
  windows-bridge:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bridge/package-lock.json
      - run: npm ci --ignore-scripts --prefix bridge
      - run: npm test --prefix bridge
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease
        working-directory: android
